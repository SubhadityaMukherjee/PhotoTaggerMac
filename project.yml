name: PhotoTagger
options:
  bundleIdPrefix: com.phototagger
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  PhotoTagger:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: MLXSwiftLM
        products:
          - MLXVLM
          - MLXLMCommon
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: PhotoTagger
        CFBundleName: PhotoTagger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "27.0"
        LSUIElement: false
        LSApplicationCategoryType: public.app-category.photography
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: PhotoTagger
        NSPhotoLibraryUsageDescription: PhotoTagger adds descriptive keywords to your photos so you can find them with search in Photos. It never edits, deletes, or re-creates your photos — it only adds keywords.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phototagger.app
        PRODUCT_NAME: PhotoTagger
        CODE_SIGNING_ENTITLEMENTS: Resources/PhotoTagger.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PhotoTaggerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phototagger.tests
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: PhotoTagger

schemes:
  PhotoTagger:
    build:
      targets:
        PhotoTagger: all
        PhotoTaggerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoTaggerTests
